<!DOCTYPE html>
<html lang="pr-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>cards Toggle</title>
</head>
<body>
    <div class="card" id="card1">
        <img src="https://toptripadventure.com.br/wp-content/uploads/2020/01/pontaGrossa.jpg" alt="">
        <h2>Buraco do padre</h2>
        <p>Um excente ponto turistico em ponta grossa</p>
    </div>
     <div class="card desligar" id="card2">
        <img src="https://www.parquedasaves.com.br/wp-content/uploads/2019/11/waterfall-1904370_1280.jpg" alt="">
        <h2>cataratas do iguaçu</h2>
        <p>Um excente ponto turistico em ponta grossa</p>
    </div>
    
     <script>
        cartao1 = document.getElementById("card1");
        cartao2 = document.getElementById("card2");
        
        cartao1.addEventListener("mouseover", ()=>{
            cartao1.classList.toggle("desligar");
            cartao2.classList.toggle("desligar");
        })

        cartao2.addEventListener("mouseover", ()=>{
            cartao1.classList.toggle("desligar");
            cartao2.classList.toggle("desligar");
        })
     </script>
</body>
</html>
